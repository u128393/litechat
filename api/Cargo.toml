[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "0.5.3"
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
clap = { version = "4.5.41", features = ["derive"] }
dialoguer = "0.11.0"
dotenvy = "0.15.7"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "stream", "rustls"] }
sea-orm = { version = "1.1.20", default-features = false, features = ["macros", "runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "with-chrono"] }
sea-orm-migration = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-mysql", "sqlx-postgres", "sqlx-sqlite"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-cookies = "0.11.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.1", features = ["v4", "serde"] }
sha2 = "0.10.9"
chrono = { version = "0.4.44", default-features = false, features = ["clock", "std", "serde"] }
rand = "0.8.6"
url = "2.5.8"
bytes = "1.11.1"
futures-util = "0.3.32"
